name: Deploy examples

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'packages/**'
      - '.github/workflows/deploy-examples.yml'
  workflow_dispatch:

concurrency:
  group: deploy-examples
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      # Each example is its own Worker, so one failure must not hide the other.
      fail-fast: false
      matrix:
        include:
          - name: TanStack Start showcase
            dir: examples/tanstack-start
            build: build:cf
          - name: Vue 3 example
            dir: examples/vue
            build: build
          - name: Plain HTML example
            dir: examples/html
            build: build
          - name: Expo web example
            dir: examples/expo
            build: build:web
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.secrets.outputs.ready == 'true'
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      - name: Build packages
        if: steps.secrets.outputs.ready == 'true'
        run: bun run build

      - name: Build ${{ matrix.name }}
        if: steps.secrets.outputs.ready == 'true'
        run: bun run --cwd ${{ matrix.dir }} ${{ matrix.build }}

      - name: Deploy ${{ matrix.name }} to Cloudflare
        if: steps.secrets.outputs.ready == 'true'
        run: bunx wrangler deploy
        working-directory: ${{ matrix.dir }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
