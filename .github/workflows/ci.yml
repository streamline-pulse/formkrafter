name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the lockfile pins the workspace versions
        run: bun run check:lock-versions

      - name: Check the CDN pins match the released version
        run: bun run check:cdn-pins

      - name: Build packages
        run: bun run build

      - name: Test
        run: bun run test

      # Bundlers tolerate extensionless relative specifiers; Node's ESM loader
      # does not. Without this, a package can pass every other check and still
      # break on import from a real Node process (SSR, externalised deps).
      - name: ESM resolution smoke test
        run: bun run smoke:esm

      - name: Packed tarball smoke test
        run: bun run smoke:pack

      - name: Size budget
        run: bun run size

      - name: Lint
        run: bun run lint

  e2e:
    runs-on: ubuntu-latest
    # The job runs inside the same image that generates the visual baselines
    # (e2e/update-linux-snapshots.sh): screenshot comparison is only
    # deterministic when CI renders with the exact same fonts and libraries.
    # Browsers ship preinstalled in the image, so no install step is needed —
    # keep the tag in sync with @playwright/test in e2e/package.json; a
    # mismatch fails loudly with "browser not found".
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
    steps:
      - uses: actions/checkout@v4

      # The Playwright image has no unzip, which setup-bun needs to extract
      # the bun archive.
      - name: Install unzip
        run: apt-get update && apt-get install -y unzip

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: End-to-end tests
        run: bun run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
