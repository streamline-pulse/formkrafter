[package]
name = "formkrafter"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Server-side validation for FormKrafter specs, with parity against the TypeScript core"
rust-version = "1.87"
readme = "README.md"
repository = "https://github.com/streamline-pulse/formkrafter"
homepage = "https://github.com/streamline-pulse/formkrafter/tree/main/rust#readme"
keywords = ["formkrafter", "forms", "json-schema", "validation"]
categories = ["web-programming", "parser-implementations"]

[dependencies]
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
