<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>FormKrafter Playground</title>
    <script type="module" src="/build/formkrafter-wc.esm.js"></script>
    <link rel="stylesheet" href="/build/formkrafter-wc.css" />
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('fk-theme')
          if (
            stored === 'dark' ||
            (!stored && matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark')
          }
        } catch {}
      })()
    </script>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
        background: #f1f5f9;
        color: #1c2b33;
      }
      .dark body {
        background: #0b141a;
        color: #e2ecf2;
      }
      h1 {
        font-size: 1.2rem;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #theme-toggle {
        font: inherit;
        font-size: 0.8rem;
        padding: 6px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      pre {
        max-height: 200px;
        overflow: auto;
        padding: 12px;
        border-radius: 8px;
        background: #1c2b33;
        color: #d7ece8;
        font-size: 0.75rem;
      }
      .preview {
        padding: 16px;
        border: 1px solid var(--fk-color-border, #cbd5e1);
        border-radius: 8px;
        background: var(--fk-color-surface, #ffffff);
        max-width: 640px;
      }
      #preview-hint {
        margin: 0;
        color: #64748b;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <h1>FormKrafter — builder</h1>
      <button type="button" id="theme-toggle">🌓 Theme</button>
    </div>
    <fk-form-builder></fk-form-builder>

    <h1>Preview</h1>
    <section id="preview-shell" class="preview">
      <p id="preview-hint">Build a form above to preview it here.</p>
      <fk-form-render id="preview" hidden></fk-form-render>
    </section>

    <h1>Data</h1>
    <pre id="data-output">(empty)</pre>

    <h1>Spec</h1>
    <pre id="spec-output">(empty)</pre>

    <script>
      const builder = document.querySelector('fk-form-builder');
      const preview = document.querySelector('#preview');
      const previewHint = document.querySelector('#preview-hint');
      const specOutput = document.querySelector('#spec-output');
      const dataOutput = document.querySelector('#data-output');

      builder.addEventListener('specChange', (event) => {
        const spec = event.detail.spec;

        specOutput.textContent = spec ? JSON.stringify(spec, null, 2) : '(empty)';
        console.log('patches', event.detail.patches);

        preview.spec = spec ? structuredClone(spec) : undefined;
        preview.hidden = !spec;
        previewHint.hidden = !!spec;
      });

      preview.addEventListener('formDataChange', (event) => {
        dataOutput.textContent = JSON.stringify(event.detail, null, 2);
      });

      document.querySelector('#theme-toggle').addEventListener('click', () => {
        const dark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('fk-theme', dark ? 'dark' : 'light');
      });
    </script>
  </body>
</html>
