<!doctype html>
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <title>FormKrafter — right to left</title>
    <link rel="stylesheet" href="/dist/formkrafter-wc.css" />
    <style>
      body { margin: 24px; font-family: ui-sans-serif, system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <fk-form-render id="renderer"></fk-form-render>

    <script type="module">
      import '/dist/formkrafter-wc.esm.js'

      // ?dir=ltr renders the same form left-to-right, so a test can compare
      // the two and catch a physical property that does not mirror.
      const dir = new URLSearchParams(location.search).get('dir') ?? 'rtl'
      document.documentElement.setAttribute('dir', dir)

      const renderer = document.getElementById('renderer')

      renderer.spec = {
        type: 'panel', id: 'column', name: 'Form',
        configs: { key: 'form' },
        children: [
          {
            type: 'input', dataType: 'string', id: 'text', name: 'Name',
            configs: { key: 'fullName', label: 'الاسم الكامل' },
            validations: [{ validator: 'required' }],
          },
          {
            type: 'input', dataType: 'string', id: 'textarea', name: 'Notes',
            configs: { key: 'notes', label: 'ملاحظات' },
          },
          {
            type: 'input', dataType: 'string', id: 'select', name: 'City',
            configs: {
              key: 'city', label: 'المدينة',
              optionsSource: 'static', options: 'الرباط\nالدار البيضاء',
            },
          },
          {
            type: 'collection', dataType: 'array', id: 'data-grid', name: 'Rows',
            configs: { key: 'rows', label: 'صفوف' },
            children: [
              {
                type: 'input', dataType: 'string', id: 'text', name: 'Item',
                configs: { key: 'item', label: 'عنصر' },
              },
            ],
          },
        ],
      }

      renderer.data = { fullName: 'عائشة', rows: [{ item: 'أول' }] }
    </script>
  </body>
</html>
