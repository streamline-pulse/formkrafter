<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FormKrafter — Vue 3 example</title>
    <script>
      // Set the theme before first paint so the page never flashes the wrong
      // one. `.dark` drives this page's own tokens; `data-fk-theme` is what
      // FormKrafter's stylesheet reads.
      ;(() => {
        const dark = !matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.dataset.fkTheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
